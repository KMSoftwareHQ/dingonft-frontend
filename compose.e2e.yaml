name: dingonft-e2e

services:
  frontend:
    build:
      context: ./apps/frontend
      dockerfile: Dockerfile.dev
    environment:
      BASE_PATH: /testing-nft-platform
      VITE_API_URL: /testing-nft-platform/api
      VITE_STORAGE_BASE: /testing-nft-platform/storage
      VITE_STORAGE_BUCKET_PREFIX: dingo-nftc-0-
      DEV_API_PROXY_TARGET: http://provider:3000
      DEV_STORAGE_PROXY_TARGET: http://minio:9000
    command: sh -c "npm ci --no-audit --no-fund && npm run build && npm run preview"
    volumes:
      - ./apps/frontend:/app
      - frontend-node-modules:/app/node_modules
      - frontend-dist:/app/dist
    depends_on:
      provider:
        condition: service_healthy
      seed:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/testing-nft-platform/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 3s
      timeout: 3s
      retries: 30

  link:
    build:
      context: ./services/link
      dockerfile: Dockerfile.dev
    environment:
      NODE_ENV: development
      PORT: "3000"
      BASE_PATH: /testing-nft-platform
      ROOT_PATH: http://localhost:3020/testing-nft-platform
      LOGO: http://localhost:3020/testing-nft-platform/dingocoin.png
      FRONTEND_URL: http://frontend:3000
      STORAGE_BASE: http://minio:9000
      STORAGE_BUCKET_PREFIX: dingo-nftc-0
    command: npm start
    depends_on:
      frontend:
        condition: service_healthy
    ports:
      - "127.0.0.1:3020:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 3s
      timeout: 3s
      retries: 30

  provider:
    build: ./e2e/fixture-provider
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 2s
      timeout: 2s
      retries: 20

  minio:
    image: quay.io/minio/minio:latest
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      timeout: 3s
      retries: 30

  seed:
    image: quay.io/minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    volumes:
      - ./services/link/dev/seed:/seed:ro
    entrypoint: ["sh", "-c"]
    command:
      - |
        set -e
        mc alias set local http://minio:9000 minioadmin minioadmin
        for b in meta preview content state profile collection; do
          bucket="dingo-nftc-0-$$b"
          mc mb --ignore-existing "local/$$bucket"
          if [ "$$b" != content ]; then mc anonymous set download "local/$$bucket"; fi
          if [ -d "/seed/$$bucket" ]; then mc mirror --overwrite "/seed/$$bucket" "local/$$bucket"; fi
        done

  e2e:
    build:
      context: ./e2e
    environment:
      E2E_BASE_URL: http://link:3000/testing-nft-platform/
    depends_on:
      link:
        condition: service_healthy
    volumes:
      - ./test-results:/tests/test-results

volumes:
  frontend-node-modules:
  frontend-dist:
