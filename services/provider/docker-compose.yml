# Local dev stack. Host ports are bound to 127.0.0.1 only.
#   API:      http://127.0.0.1:8090
#   Postgres: 127.0.0.1:5434 (dingo / dingopassword)
#   MinIO:    http://127.0.0.1:9210 (console :9211, minioadmin / minioadmin)
name: dingonft-provider

services:
  dingocoind:
    build: docker/dingocoind
    restart: unless-stopped
    volumes:
      - dingo-data:/home/dingo/.dingocoin
      - dingo-rpc:/rpc
    healthcheck:
      test: ["CMD", "dingocoin-cli", "-rpcport=34646", "-rpccookiefile=/rpc/.cookie", "getblockchaininfo"]
      interval: 10s
      timeout: 10s
      start_period: 5m
      retries: 30

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: dingo
      POSTGRES_PASSWORD: dingopassword
      POSTGRES_DB: dingo
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    ports:
      - "127.0.0.1:5434:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "dingo", "-d", "dingo"]
      interval: 5s
      retries: 20

  minio:
    image: quay.io/minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio-data:/data
    ports:
      - "127.0.0.1:9210:9000"
      - "127.0.0.1:9211:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      retries: 20

  # Creates the buckets. Everything except content is public-read, since the frontend reads it directly.
  minio-init:
    image: quay.io/minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["sh", "-c"]
    command:
      - |
        set -e
        mc alias set local http://minio:9000 minioadmin minioadmin
        for b in meta preview content state profile collection; do mc mb --ignore-existing local/dingo-nft-$$b; done
        for b in meta preview state profile collection; do mc anonymous set download local/dingo-nft-$$b; done

  app:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
    restart: unless-stopped
    depends_on:
      dingocoind:
        condition: service_healthy
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgres://dingo:dingopassword@postgres:5432/dingo
      DINGO_RPC_HOST: dingocoind
      DINGO_RPC_PORT: "34646"
      DINGO_COOKIE_PATH: /rpc/.cookie
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin
      S3_FORCE_PATH_STYLE: "true"
    volumes:
      # Source is bind-mounted, so `docker compose restart app` picks up edits.
      - ./:/app
      - /app/node_modules
      - app-settings:/settings
      - dingo-rpc:/rpc:ro
    ports:
      - "127.0.0.1:8090:80"

volumes:
  dingo-data:
  dingo-rpc:
  pg-data:
  minio-data:
  app-settings:
