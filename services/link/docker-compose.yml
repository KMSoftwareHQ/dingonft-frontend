# Local S3-compatible object storage for development. Mirrors the five
# production buckets and seeds them from dev/seed/. Start with `yarn dev:storage`.
services:
  minio:
    image: quay.io/minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "127.0.0.1:9000:9000"   # S3 API  -> STORAGE_BASE=http://localhost:9000
      - "127.0.0.1:9001:9001"   # web console (minioadmin / minioadmin)
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      timeout: 5s
      retries: 30

  # One-shot: create buckets, make them publicly readable (like the real
  # Vultr buckets), and upload dev/seed/. Re-run any time with `yarn dev:seed`.
  seed:
    image: quay.io/minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    volumes:
      - ./dev/seed:/seed:ro
    entrypoint: /bin/sh
    command:
      - -ec
      - |
        mc alias set local http://minio:9000 minioadmin minioadmin
        for b in meta preview state profile collection; do
          bucket="dingo-nftc-0-$$b"
          mc mb --ignore-existing "local/$$bucket"
          mc anonymous set download "local/$$bucket"
          if [ -d "/seed/$$bucket" ]; then
            mc mirror --overwrite "/seed/$$bucket" "local/$$bucket"
          fi
        done
        echo "seeded:"; mc ls --recursive local/

volumes:
  minio-data:
