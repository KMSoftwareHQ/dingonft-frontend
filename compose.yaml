name: dingonft

services:
  frontend:
    build:
      context: ./apps/frontend
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    user: "${DEV_UID:-1001}:${DEV_GID:-1001}"
    environment:
      BROWSER: none
      npm_config_cache: /tmp/npm-cache
      BASE_PATH: ${BASE_PATH:-/testing-nft-platform}
      VITE_API_URL: ${VITE_API_URL:-/testing-nft-platform/api}
      VITE_STORAGE_BASE: ${VITE_STORAGE_BASE:-/testing-nft-platform/storage}
      VITE_STORAGE_BUCKET_PREFIX: ${STORAGE_BUCKET_PREFIX:-dingo-nftc-0}-
      DEV_API_PROXY_TARGET: http://provider:80
      DEV_STORAGE_PROXY_TARGET: http://minio:9000
    volumes:
      - ./apps/frontend:/app
      - frontend-node-modules:/app/node_modules
    depends_on:
      provider:
        condition: service_started
    healthcheck:
      test: ["CMD", "node", "-e", "fetch(new URL((process.env.BASE_PATH || '').replace(/\\/$/, '') + '/', 'http://localhost:3000')).then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 30

  # The v2 frontend (apps/frontend-v2) on fake data from its mock backend
  # (apps/frontend-v2/mock), at http://localhost:3022/testing-nft-platform/v2/
  # (V2_PORT, V2_BASE_PATH). Point V2_API_PROXY_TARGET/V2_STORAGE_PROXY_TARGET elsewhere
  # (e.g. http://provider:80, http://minio:9000) to use other data.
  frontend-v2:
    build:
      context: ./apps/frontend-v2
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    user: "${DEV_UID:-1001}:${DEV_GID:-1001}"
    environment:
      npm_config_cache: /tmp/npm-cache
      BASE_PATH: ${V2_BASE_PATH:-/testing-nft-platform/v2}/
      VITE_API_URL: ${V2_BASE_PATH:-/testing-nft-platform/v2}/api
      VITE_STORAGE_BASE: ${V2_BASE_PATH:-/testing-nft-platform/v2}/storage
      VITE_STORAGE_BUCKET_PREFIX: dingo-nftc-0-
      DEV_API_PROXY_TARGET: ${V2_API_PROXY_TARGET:-http://frontend-v2-mock:4000/api}
      DEV_STORAGE_PROXY_TARGET: ${V2_STORAGE_PROXY_TARGET:-http://frontend-v2-mock:4000/storage}
      # Extra host names the dev server answers to (e.g. behind a reverse proxy).
      DEV_ALLOWED_HOSTS: ${V2_ALLOWED_HOSTS:-}
    volumes:
      - ./apps/frontend-v2:/app
      - frontend-v2-node-modules:/app/node_modules
    ports:
      - "127.0.0.1:${V2_PORT:-3022}:3000"
    depends_on:
      frontend-v2-mock:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch(new URL(process.env.BASE_PATH, 'http://localhost:3000')).then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 30

  # Fake provider API + object storage for frontend-v2: a seeded world of
  # creators, collections, NFTs with generated art, and trade history. Writes
  # apply in memory and reset on restart.
  frontend-v2-mock:
    image: node:24.22.1-bookworm-slim
    restart: unless-stopped
    user: "${DEV_UID:-1001}:${DEV_GID:-1001}"
    working_dir: /mock
    command: ["node", "server.js"]
    environment:
      PUBLIC_STORAGE: ${V2_BASE_PATH:-/testing-nft-platform/v2}/storage
    volumes:
      - ./apps/frontend-v2/mock:/mock:ro
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 3s
      timeout: 3s
      retries: 20

  link:
    build:
      context: ./services/link
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    user: "${DEV_UID:-1001}:${DEV_GID:-1001}"
    environment:
      NODE_ENV: development
      PORT: "3000"
      BASE_PATH: ${BASE_PATH:-/testing-nft-platform}
      ROOT_PATH: ${PUBLIC_URL:-http://localhost:3020/testing-nft-platform}
      LOGO: ${PUBLIC_URL:-http://localhost:3020/testing-nft-platform}/dingocoin.png
      FRONTEND_URL: http://frontend:3000
      STORAGE_BASE: http://minio:9000
      STORAGE_BUCKET_PREFIX: ${STORAGE_BUCKET_PREFIX:-dingo-nftc-0}
    volumes:
      - ./services/link:/app
      - link-node-modules:/app/node_modules
    depends_on:
      frontend:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3020}:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20

  provider:
    build:
      context: ./services/provider
      dockerfile: docker/app/Dockerfile
    restart: unless-stopped
    depends_on:
      dingocoind:
        condition: service_healthy
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgres://dingo:dingopassword@postgres:5432/dingo
      DINGO_RPC_HOST: dingocoind
      DINGO_RPC_PORT: "34646"
      DINGO_COOKIE_PATH: /rpc/.cookie
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin
      S3_FORCE_PATH_STYLE: "true"
      STORAGE_BUCKET_PREFIX: ${STORAGE_BUCKET_PREFIX:-dingo-nftc-0}
    volumes:
      - ./services/provider:/app
      - provider-node-modules:/app/node_modules
      - provider-settings:/settings
      - dingo-rpc:/rpc:ro
    ports:
      - "127.0.0.1:${PROVIDER_PORT:-8090}:80"

  dingocoind:
    build: ./services/provider/docker/dingocoind
    restart: unless-stopped
    volumes:
      - dingo-data:/home/dingo/.dingocoin
      - dingo-rpc:/rpc
    healthcheck:
      test: ["CMD", "dingocoin-cli", "-rpcport=34646", "-rpccookiefile=/rpc/.cookie", "getblockchaininfo"]
      interval: 10s
      timeout: 10s
      start_period: 5m
      retries: 30

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: dingo
      POSTGRES_PASSWORD: dingopassword
      POSTGRES_DB: dingo
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./services/provider/database/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5434}:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "dingo", "-d", "dingo"]
      interval: 5s
      retries: 20

  minio:
    image: quay.io/minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio-data:/data
    ports:
      - "127.0.0.1:${MINIO_PORT:-9210}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9211}:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      retries: 20

  minio-init:
    image: quay.io/minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    environment:
      STORAGE_BUCKET_PREFIX: ${STORAGE_BUCKET_PREFIX:-dingo-nftc-0}
    entrypoint: ["sh", "-c"]
    command:
      - |
        set -e
        mc alias set local http://minio:9000 minioadmin minioadmin
        for b in meta preview content state profile collection; do mc mb --ignore-existing local/$${STORAGE_BUCKET_PREFIX}-$$b; done
        for b in meta preview state profile collection; do mc anonymous set download local/$${STORAGE_BUCKET_PREFIX}-$$b; done

volumes:
  dingo-data:
  dingo-rpc:
  pg-data:
  minio-data:
  provider-settings:
  frontend-node-modules:
  frontend-v2-node-modules:
  provider-node-modules:
  link-node-modules:
